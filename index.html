<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,serif;color:#f8edff;background:radial-gradient(circle at 50% 0%,#49206b 0,#1b0c2b 35%,#080510 80%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,#fff 1px,transparent 1px),radial-gradient(circle,#cda7ff 1px,transparent 1px);background-size:75px 75px,125px 125px;background-position:10px 20px,40px 70px}
.container{width:min(1100px,94%);margin:auto;padding:30px 0 60px;position:relative}
header{text-align:center;margin-bottom:25px}
h1{margin:0;font-size:clamp(32px,7vw,65px);color:#f5d88a;text-shadow:0 0 20px #a66cff}
.subtitle{color:#d8c5e9;margin-top:8px}
.panel{background:rgba(24,12,39,.82);border:1px solid #775099;border-radius:20px;padding:20px;box-shadow:0 0 35px rgba(125,60,190,.25);backdrop-filter:blur(10px)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #9166b8;background:#180d27;color:white;font-size:15px}
button{cursor:pointer;background:linear-gradient(135deg,#5c2d87,#9b5bd0);font-weight:bold;transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 0 20px #8f4fd0}
.draw-area{text-align:center;margin:25px 0}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}
.card-wrap{perspective:1000px;min-height:380px}
.tarot-card{width:100%;max-width:240px;height:380px;margin:auto;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .8s}
.tarot-card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;border:3px solid #d5af54;box-shadow:0 0 25px rgba(215,170,75,.25)}
.back{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#251039 0,#251039 10px,#3c1858 10px,#3c1858 20px)}
.back-inner{width:80%;height:88%;border:2px solid #d5af54;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:70px;color:#e8c56d;text-shadow:0 0 20px #e8c56d}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 25%,#6f428e,#21102f 55%,#0d0714);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front img{width:100%;height:250px;object-fit:cover;border-radius:10px;border:1px solid #d5af54}
.front h2{color:#f4d47f;margin:8px 0 3px;font-size:20px}
.orientation{color:#d8b7ff;font-size:14px}
.hint{font-size:12px;color:#bca8ca;margin-top:20px}
.result{margin-top:25px}
.meaning{background:rgba(13,6,23,.75);border-left:4px solid #d6ad58;padding:18px;margin:15px 0;border-radius:10px;line-height:1.65}
.meaning h2{color:#f1ce73;margin:5px 0 12px}
.meaning b{color:#e7c76f}
.tag{display:inline-block;padding:5px 10px;border-radius:20px;background:#43205d;color:#e4c8ff;font-size:12px;margin:3px}
.message{margin-top:18px;padding:16px;border:1px solid #6f4b8d;border-radius:14px;background:rgba(70,34,90,.3);text-align:center;color:#ead6f7}
.disclaimer{text-align:center;margin-top:30px;color:#a994b4;font-size:12px}
@media(max-width:750px){.controls{grid-template-columns:1fr}#cards{grid-template-columns:1fr}.tarot-card{height:350px}.card-wrap{min-height:350px}}

.library-wrap{margin-top:28px;padding:22px;border:1px solid rgba(212,175,55,.25);border-radius:20px;background:rgba(18,10,35,.72);box-shadow:0 10px 35px rgba(0,0,0,.25)}
.library-wrap h2{margin:0 0 8px;color:#f1d37a}
.library-note{opacity:.82;line-height:1.6}
.search-box{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid rgba(212,175,55,.35);background:#120b20;color:#fff;margin:10px 0 18px}
.library-card{margin:14px 0;padding:18px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.library-card h3{margin:0 0 10px;color:#f1d37a}
.library-card p{line-height:1.65;margin:7px 0}
.library-card .tag{font-weight:700;color:#e7c76b}

i melihat kemungkinan yang lebih luas. Kartu ini berbicara tentang memilih arah berikutnya dengan mempertimbangkan tujuan jangka panjang, bukan sekadar kenyamanan saat ini.","revDetail":"Keraguan terhadap masa depan dapat membuatmu terus merencanakan tanpa benar-benar memilih. Bisa juga menunjukkan rencana yang terlalu bergantung pada sesuatu yang belum pasti.","love":"Hubungan memasuki fase mempertanyakan arah: lanjut serius, memperluas komitmen, atau mencari jalan berbeda. Kejujuran tentang masa depan menjadi penting.","career":"Kamu sedang berada di antara posisi aman dan peluang berkembang. Pertimbangkan ekspansi, perpindahan, atau tanggung jawab baru dengan perhitungan matang.","money":"Perencanaan keuangan jangka menengah lebih penting daripada keuntungan cepat. Jangan mengeluarkan uang besar sebelum tujuan dan risikonya jelas.","message":"Pilih arah dengan sadar; masa depan dibentuk oleh keputusan yang kamu ambil sekarang."},{"name":"Three of Wands","suit":"Wands","up":"Ekspansi, perkembangan, peluang baru, dan hasil dari perencanaan.","rev":"Penundaan, harapan tidak sesuai kenyataan, atau kurang persiapan.","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCACnAGoDASIAAhEBAxEB/8QAHQAAAgEFAQEAAAAAAAAAAAAABwgGAAIDBAUBCf/EAFQQAAEDAgUCAwQEBwgNDQAAAAECAwQFEQAGBxIhEzEIQVEJFCJhFSMycRYkQlKBkaEXGTNipbTB0TQ3U2NkdISUpLGy1PAYJSY2RmZyhZKTs7Xx/8QAGwEAAgMBAQEAAAAAAAAAAAAABAYDBQcBAgD/xABBEQABAwIDBAYGBggHAAAAAAABAgMRAAQFITESE0FRYXGBobHBBhQiMpHRM1Jyc7LhFRYkJUKC8PEjNUNiY5LC/9oADAMBAAIRAxEAPwBkm8+VBaSp9nMMtZ/u2V4xt38y4ceS84xnV7pcWrIWfy15NbX6+aArHiOR9kJB7Afp4xm2gshZIAvbjuDzcfLGWfrA8nLdp7/nTb+jmz/Ee75VzZ2aMuS0uw5cWVKQtBDiHsjLWhSebg/UWIxxkUPTB6wdyfSrfx9PSPX+8Ylgb5JJ4A7D/jti5httEhO+wIUCbi9ufT0wQn0keGW7HfUBwxH1j3VxGMn6RKcS5+CFDDieUlWQlpsef8HGO61WsqU34KbTqUzbizeTnUgd/RAwslY061Edy5WIcSjVpDk an, atau kekecewaan terlihat jelas. Kartu ini tidak menjanjikan rasa sakit akan langsung hilang, tetapi menunjukkan bahwa pengakuan terhadap luka adalah awal penyembuhan.","revDetail":"Rasa sakit mulai diproses, tetapi mungkin masih ada luka yang disimpan. Pengampunan tidak berarti membenarkan kejadian; ia berarti berhenti membiarkan luka mengendalikan masa depan.","love":"Patah hati, konflik serius, pengkhianatan, atau kenyataan yang sulit diterima dapat muncul. Penyembuhan membutuhkan batas dan kejujuran.","career":"Kritik, penolakan, atau kegagalan dapat terasa personal. Pisahkan harga diri dari hasil satu proyek atau keputusan.","money":"Kerugian akibat keputusan buruk perlu diakui. Jangan mengejar uang yang hilang melalui tindakan panik.","message":"Rasa sakit perlu diakui agar bisa disembuhkan."},{"name":"Four of Swords","suit":"Swords","up":"Istirahat, pemulihan, refleksi, dan mengambil jeda.","rev":"Kelelahan, sulit beristirahat, atau kembali bergerak setelah masa diam.","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCACSAGsDASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAABgcFCAAECQMCAf/EAFEQAAEDAwMCAgYEBgoRBQAAAAECAwQFBhEABxIhMQgTCRQiQVFhFSMycRZSYmORoRcYJEKBscHD0eElM0dWc4OEk5Wio7KztNLT8HJ0hZTC/8QAGwEAAgMBAQEAAAAAAAAAAAAAAgMBBAUABgf/xAAvEQABBAEDAgUDBAIDAAAAAAABAAIDESEEEjFBUQUiYXGhMpHBE0Kx8BRSctHh/9oADAMBAAIRAxEAPwC0dKuaoi5qDSbjse3KdGrb0iKzKpVXelutOtx3H/aQuO2OJS2oZByDjprn/wClhDTe9VpR2mWmm27ZQEhtIHQyn+nzxq/NejPO7ibY8MAN1ac4QR7voySMdvnrn76V/kje61FHubZR+qU/qoxoa8ECsJhcXNyVbX0fNT9a8J1gQ2E+UlhM5CwkdFL9dfJPbuQQM/LS1pnpGKjUFNOtbbOtR331RmpMiqBDBcGfZU75ISnoMnJ6Dvo39GYtcnw12olfUCRPSnp7vWT/ACnVZvDhQYSZcJ6qMOinLXJVLaqk7y6KuMA629JfStvglbZKEj2ipWeg1QmkMDJZg3dtzX3VtjQ/a3hP+seP+56HVqTTH9s2XH6sFmC7HrKvJfCXFNrUlwtAEJUk5V9kDrnHXW076QCrNW5XayqxYzsSjSokSR6rXw9yXJKg2ULQ2UKT7PU56ZGkRVVoqNqvVS an aset tinggi bila dikelola disiplin. Hindari keserakahan atau investasi yang hanya mengejar status.","message":"Kesuksesan terbaik adalah yang memberi keamanan tanpa membuatmu diperbudak oleh materi."}];
const positions={1:["Pesan Untukmu"],3:["Masa Lalu","Situasi Saat Ini","Masa Depan"],5:["Situasi Saat Ini","Tantangan","Yang Tersembunyi","Saran","Kemungkinan Arah"]};
const topicLabel={umum:"🔮 Kehidupan Umum",cinta:"❤️ Cinta",karier:"💼 Karier",uang:"💰 Keuangan"};
const messages=[
"Ambil pesan kartu sebagai bahan refleksi, bukan kepastian. Kamu tetap memegang pilihan dan tindakanmu sendiri.",
"Perhatikan pola yang berulang. Kadang jawaban terbaik muncul setelah kita berhenti bereaksi dan mulai mengamati.",
"Jangan memaksa semua hal memiliki jawaban hari ini. Beri ruang untuk informasi baru datang.",
"Gunakan intuisi bersama fakta. Keduanya bisa berjalan berdampingan ketika mengambil keputusan penting.",
"Perubahan tidak selalu berarti kehilangan; kadang perubahan adalah cara sebuah fase memberi ruang untuk fase berikutnya.",
"Fokus pada satu langkah nyata yang bisa kamu lakukan sekarang daripada mencoba mengendalikan seluruh masa depan."
];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ramal(){
 const jumlah=Number(document.getElementById("jumlah").value);
 const arah=document.getElementById("arah").value;
 const topik=document.getElementById("topik").value;
 const selected=shuffle(deck).slice(0,jumlah);
 const cards=document.getElementById("cards"),hasil=document.getElementById("hasil");
 cards.innerHTML="";hasil.innerHTML="";
 selected.forEach((card,index)=>{
   let reversed=arah==="tegak"?false:arah==="terbalik"?true:Math.random()>.5;
   const wrap=document.createElement("div");wrap.className="card-wrap";
   wrap.innerHTML=`<div class="tarot-card" onclick="this.classList.toggle('flipped')">
    <div class="face back"><div class="back-inner">✦</div></div>
    <div class="face front"><img src="${card.image}" alt="${esc(card.name)}"><h2>${esc(card.name)}</h2><div class="orientation">${reversed?"⬇️ TERBALIK":"⬆️ TEGAK"}</div><div class="hint">Klik kartu untuk membalik</div></div>
   </div>`;
   cards.appendChild(wrap);
   const meaning=reversed?card.rev:card.up;
   const explanation=reversed?card.revDetail:card.upDetail;
   let topicText=topic==="cinta"?card.love:topic==="karier"?card.career:topic==="uang"?card.money:"Kartu ini mengajakmu melihat situasi secara lebih sadar, mengenali pola yang sedang terjadi, dan memilih tindakan yang paling sesuai dengan nilai serta keadaan nyata.";
   hasil.innerHTML+=`<div class="meaning">
    <span class="tag">${esc(positions[jumlah][index])}</span><span class="tag">${reversed?"⬇️ Reversed":"⬆️ Upright"}</span><span class="tag">${esc(topicLabel[topik])}</span>
    <h2>${card.s} ${esc(card.name)}</h2>
    <p><b>🔮 Makna:</b><br>${esc(meaning)}</p>
    <p><b>📖 Penjelasan:</b><br>${esc(explanation)}</p>
    <p><b>${esc(topicLabel[topik])}:</b><br>${esc(topicText)}</p>
   </div>`;
 });
 hasil.innerHTML+=`<div class="message">✨ ${messages[Math.floor(Math.random()*messages.length)]}</div>`;
 cards.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>

<script>
function renderLibrary(){
  const q=(document.getElementById('cardSearch')?.value||'').toLowerCase().trim();
  const box=document.getElementById('libraryGrid');
  if(!box) return;
  const list=deck.filter(c=>c.name.toLowerCase().includes(q));
  box.innerHTML=list.map(c=>`
    <article class="library-card">
      <h3>${c.name}</h3>
      <p><span class="tag">⬆️ Tegak:</span> ${c.up}</p>
      <p><span class="tag">📖 Penjelasan:</span> ${c.upDetail}</p>
      <p><span class="tag">⬇️ Terbalik:</span> ${c.rev}</p>
      <p><span class="tag">📖 Penjelasan:</span> ${c.revDetail}</p>
      <p><span class="tag">❤️ Cinta:</span> ${c.love}</p>
      <p><span class="tag">💼 Karier:</span> ${c.career}</p>
      <p><span class="tag">💰 Keuangan:</span> ${c.money}</p>
      <p><span class="tag">✨ Pesan:</span> ${c.message}</p>
    </article>`).join('');
}
document.addEventListener('DOMContentLoaded',renderLibrary);
</script>
